services:
  keeper-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: keeper-mcp:latest
    container_name: keeper-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_HTTP_PORT=8080
    # Health check is inherited from the Dockerfile HEALTHCHECK (curl-based).

volumes: {}
